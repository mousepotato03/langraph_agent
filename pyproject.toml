[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai101-agent"
version = "1.1.0"
description = "AI tool recommendation with LangGraph, retrieval, and human plan review"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142,<0.143",
    "langchain-core>=1.6,<2",
    "langchain-openai>=1.6,<2",
    "langgraph>=1.2.12,<2",
    "pydantic>=2.13,<3",
    "python-dotenv>=1.2,<2",
    "uvicorn[standard]>=0.54,<0.55",
]

[project.optional-dependencies]
ui = ["gradio>=6.29,<7"]
rag = [
    "chromadb>=1.5,<2",
    "langchain-text-splitters>=1.1,<2",
    "pypdf>=6.19,<7",
    "sentence-transformers>=5,<6",
]
search = ["google-api-python-client>=2.201,<3"]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.16,<0.17",
    "httpx>=0.28,<0.29",
    "chromadb>=1.5,<2",
    "langchain-text-splitters>=1.1,<2",
    "pypdf>=6.19,<7",
    "gradio>=6.29,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["agent", "app", "core", "prompts", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
